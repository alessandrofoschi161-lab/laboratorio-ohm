name: Test automatico invio PDF Drive

on:
  pull_request:
    branches: [ main ]

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Invia PDF di test ad Apps Script
        shell: bash
        run: |
          cat > payload.json <<'EOF'
          {
            "nome": "TEST_AUTOMATICO_CHATGPT",
            "classe": "3TEST",
            "gruppo": "AUTO",
            "data": "2026-10-24",
            "pdfBase64": ""
          }
          EOF
          RESPONSE=$(curl -L -sS --fail-with-body \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data-binary @payload.json \
            'https://script.google.com/macros/s/AKfycbxeArhTIVLEn1uysWIxoH2zhYyHY-JTLeDVtTqSHLlZPjfH1zBhfJOqa8pm66m2_QOg/exec')
          echo "Risposta Apps Script: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
