<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio – Energia meccanica</title>
<style>body{font-family:Arial,sans-serif;padding:30px;color:#1f2937}.load{max-width:760px;margin:60px auto;padding:24px;border:1px solid #cbd5e1;border-radius:14px;background:#f8fafc}</style>
</head>
<body>
<div class="load"><h2>Caricamento del laboratorio…</h2><p>Preparazione della web app e del modulo di invio PDF a Drive.</p></div>
<script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/alessandrofoschi161-lab/laboratorio-ohm/41254c9dd69f34b3307d23bb20f2e16bb5115ca2/energia-meccanica/index.html';
  const DRIVE_WEBAPP_URL='https://script.google.com/macros/s/AKfycbxeArhTIVLEn1uysWIxoH2zhYyHY-JTLeDVtTqSHLlZPjfH1zBhfJOqa8pm66m2_QOg/exec';
  try{
    let html=await (await fetch(BASE,{cache:'no-store'})).text();
    html=html.replace('</head>',`\n<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>\n<style>@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}</style>\n</head>`);
    const oldExport='<section class="sheet"><h2>Esportazione della relazione</h2><button class="primary" onclick="window.print()">Esporta relazione in PDF</button> <button class="secondary" onclick="csv()">Esporta dati CSV</button><div class="feedback">Per il PDF scegli <b>Salva come PDF</b> nella finestra di stampa.</div></section>';
    const newExport='<section class="sheet" id="exportSection"><h2>Esportazione e invio della relazione</h2><button class="primary" onclick="window.print()">Esporta relazione in PDF</button> <button class="secondary" onclick="csv()">Esporta dati CSV</button> <button class="primary" onclick="sendPDFToDrive()">Invia relazione PDF a Drive</button><div id="sendStatus" class="feedback">Compila la relazione e, al termine, inviala direttamente alla cartella Drive del docente.</div></section>';
    html=html.replace(oldExport,newExport);
    const driveCode=`\nconst DRIVE_WEBAPP_URL='${DRIVE_WEBAPP_URL}';\nasync function makePDFBase64(){\n  const {jsPDF}=window.jspdf;\n  const exportSection=document.getElementById('exportSection');\n  const oldDisplay=exportSection.style.display;\n  exportSection.style.display='none';\n  const buttons=[...document.querySelectorAll('button')];\n  const oldButtonDisplays=buttons.map(b=>b.style.display);\n  buttons.forEach(b=>b.style.display='none');\n  try{\n    const canvas=await html2canvas(document.body,{scale:1.5,useCORS:true,backgroundColor:'#ffffff',logging:false,windowWidth:document.documentElement.scrollWidth});\n    const imgData=canvas.toDataURL('image/jpeg',0.92);\n    const pdf=new jsPDF('p','mm','a4');\n    const pageW=210,pageH=297,margin=8,usableW=pageW-2*margin;\n    const imgH=canvas.height*usableW/canvas.width;\n    let offset=0;\n    while(offset<imgH){if(offset>0)pdf.addPage();pdf.addImage(imgData,'JPEG',margin,margin-offset,usableW,imgH);offset+=pageH-2*margin;}\n    return pdf.output('datauristring').split(',')[1];\n  }finally{exportSection.style.display=oldDisplay;buttons.forEach((b,i)=>b.style.display=oldButtonDisplays[i]);}\n}\nasync function sendPDFToDrive(){\n  const status=document.getElementById('sendStatus');\n  const nome=document.getElementById('studentNames').value.trim();\n  const classe=document.getElementById('studentClass').value.trim();\n  const gruppo=document.getElementById('studentGroup').value.trim();\n  const data=document.getElementById('studentDate').value.trim();\n  if(!nome||!classe||!gruppo||!data){status.innerHTML='<span class="bad">Completa Nome/componenti, Classe, Gruppo e Data prima dell’invio.</span>';return;}\n  if(!S.e){status.innerHTML='<span class="bad">Prima valida la tabella delle energie.</span>';return;}\n  status.innerHTML='<span class="warn">Generazione del PDF e invio in corso…</span>';\n  try{\n    const pdfBase64=await makePDFBase64();\n    const payload={nome,classe,gruppo,data,pdfBase64};\n    await fetch(DRIVE_WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'payload='+encodeURIComponent(JSON.stringify(payload))});\n    status.innerHTML='<span class="ok">Relazione inviata.</span> Il PDF è stato trasmesso alla cartella Drive del docente, nella sottocartella della classe.';\n  }catch(err){console.error(err);status.innerHTML='<span class="bad">Invio non riuscito.</span> Controlla la connessione e riprova.';}\n}\n`;
    const endTag='<'+'/script></body></html>';
    html=html.replace(endTag,driveCode+endTag);
    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<div class="load"><h2>Errore di caricamento</h2><p>'+String(err)+'</p></div>';}
})();
</script>
</body>
</html>
